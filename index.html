<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX AI • POCO</title><style>body{margin:0;background:#0c1528;color:#eaf5ff;font:16px system-ui;padding:18px}header{display:flex;justify-content:space-between;align-items:center}button,input{font:inherit;border:0;border-radius:12px;padding:12px;margin:5px;background:#275788;color:white}button{cursor:pointer}.face{width:160px;height:170px;border:4px solid #5da7ed;border-radius:36px;background:#091b30;display:grid;place-items:center;box-shadow:0 0 28px #20446b}.eyes{display:flex;gap:25px}.eye{width:31px;height:47px;background:#56dfff;border-radius:50%;animation:blink 6s infinite}.mouth{width:58px;height:20px;border-bottom:8px solid #56dfff;border-radius:50%}.talk .mouth{animation:talk .22s infinite alternate}@keyframes blink{96%{transform:scaleY(1)}98%{transform:scaleY(.08)}100%{transform:scaleY(1)}}@keyframes talk{to{height:35px;border-radius:45%;border:6px solid #56dfff}}main{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:24px 0}.panel{background:#1a2b45;border-radius:20px;padding:18px;flex:1;min-width:210px}.bubble main{display:block}.bubble .face{position:relative;width:110px;height:120px;cursor:move}.bubble .panel{margin-top:15px}.bubble .eye{width:22px;height:33px}.bubble .mouth{width:42px}#log{white-space:pre-wrap;min-height:65px}small{color:#a9bfd5}input{width:65%;box-sizing:border-box}</style></head><body><header><b>🤖 MAX AI • POCO 4.0</b><small>Teste HTTPS</small></header><p><button onclick="document.body.className='bubble'">◉ Bolha</button><button onclick="document.body.className=''">▣ Painel lateral</button></p><main><div class="face" id="face"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div><section class="panel"><b>💬 Conversa com Max</b><p id="log">Pronto para testar!</p><small id="status">Microfone ainda não testado.</small></section></main><button onclick="speak('Olá! Sou o Max. Vamos testar minha voz?')">🔊 Testar voz</button><button onclick="listen()">🎙️ Falar com Max</button><button onclick="speechSynthesis.cancel()">⏹️ Parar</button><p><input id="msg" placeholder="Digite uma mensagem"><button onclick="reply(document.getElementById('msg').value)">Enviar</button></p><small>Versão de demonstração. Ainda não conectada ao ChatGPT. O reconhecimento de fala depende do Chrome, da permissão do microfone e do serviço de reconhecimento disponível.</small><script>function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.onstart=()=>document.getElementById('face').classList.add('talk');u.onend=()=>document.getElementById('face').classList.remove('talk');u.onerror=()=>document.getElementById('face').classList.remove('talk');speechSynthesis.speak(u)}function reply(t){if(!t.trim())return;let a='Entendi: '+t+'. Estou em modo de demonstração. Vamos evoluir juntos!';document.getElementById('log').textContent='Você: '+t+'\nMax: '+a;speak(a)}function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('status').textContent='Reconhecimento não disponível neste navegador.';return}let r=new R();r.lang='pt-BR';r.interimResults=false;r.onstart=()=>document.getElementById('status').textContent='🎙️ Ouvindo...';r.onresult=e=>{let t=e.results[0][0].transcript;document.getElementById('msg').value=t;reply(t)};r.onerror=e=>document.getElementById('status').textContent='Erro: '+e.error;r.onend=()=>{if(document.getElementById('status').textContent==='🎙️ Ouvindo...')document.getElementById('status').textContent='Escuta encerrada.'};try{r.start()}catch(e){document.getElementById('status').textContent=e.message}}</script></body></html>
